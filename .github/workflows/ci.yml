name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/validate_plugin.py
      - run: dotnet build IoddFinder.sln -c Release
      - run: dotnet test IoddFinder.sln -c Release --no-build
      - run: python tests/smoke.py -- dotnet src/IoddFinder.Cli/bin/Release/net10.0/iodd.dll
